# Local development services.
#
# The app runs on SQLite by default and needs nothing from this file. Bring these
# up only when working against PostgreSQL — see "Database" in the project README.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Redis is not here yet. It arrives with Sidekiq, which is deferred until a
# milestone actually needs background jobs.

name: twitter-clone

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twitter_clone
      POSTGRES_PASSWORD: twitter_clone
      POSTGRES_DB: twitter_clone_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U twitter_clone -d twitter_clone_development" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
