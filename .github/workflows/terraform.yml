name: Terraform

# The standard flow (ADR 0004, superseding ADR 0003's manual-only shape):
# every pull request that touches the Terraform gets fmt → validate → plan
# against a fresh floci emulator, with the plan posted on the pull request
# as a comment; merging to main runs the same steps and applies. A manual
# dispatch runs the plan half only, for an on-demand check between changes.
#
# The emulator is ephemeral, so every apply proves the configuration stands
# up from nothing. There is no real AWS account anywhere in this — the
# provider points at floci, and pointing it anywhere else is out of scope
# by the project premise.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

concurrency:
  # One at a time per ref. Two applies against one emulator would race on
  # state; runs on main queue rather than cancel, because each is an apply.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_ROOT: infra/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  terraform:
    name: "terraform ${{ github.event_name == 'push' && 'apply' || 'plan' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No Docker socket, which the I-1a spike proved is enough: EKS applies in
    # mock mode, and every other service in the design is in-process anyway.
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_EKS_MOCK: "true"
          FLOCI_STORAGE_MODE: memory

    steps:
      - uses: actions/checkout@v4

      - name: Check the Terraform root exists
        run: |
          set -euo pipefail
          if [ ! -d "$TF_ROOT" ] || [ -z "$(find "$TF_ROOT" -maxdepth 1 -name '*.tf' -print -quit)" ]; then
            echo "::error::No Terraform found in $TF_ROOT."
            exit 1
          fi

      # The wrapper is deliberately left on (the default): it captures each
      # step's stdout so the plan can be posted on the pull request.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Wait for floci to answer
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:4566/ >/dev/null 2>&1; then
              echo "floci is answering on :4566"
              exit 0
            fi
            sleep 2
          done
          echo "::error::floci never answered on :4566."
          exit 1

      # The one ordering problem in the pipeline: state lives in the emulator's
      # S3, and Terraform is what creates buckets — so the bucket has to exist
      # before `init`. The emulator is fresh every run, so this runs every run.
      # The name must match the `backend "s3"` block in the Terraform.
      - name: Bootstrap the state bucket
        run: |
          set -euo pipefail
          bucket="$(grep -rhoP '(?<=bucket\s{0,10}=\s{0,10}")[^"]+' "$TF_ROOT"/*.tf | head -1 || true)"
          if [ -z "$bucket" ]; then
            echo "::error::Could not read the state bucket name from the backend block in $TF_ROOT."
            exit 1
          fi
          echo "Creating state bucket: $bucket"
          aws --endpoint-url http://localhost:4566 s3api create-bucket --bucket "$bucket" 2>/dev/null \
            || echo "Bucket already exists, continuing."

      # fmt, validate and plan carry on through failure so the pull request
      # comment can report every outcome; the job is failed explicitly
      # afterwards. init stays fatal — nothing after it can work without it.
      - name: Format check
        id: fmt
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive -no-color
        continue-on-error: true

      - name: Init
        id: init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -no-color

      - name: Validate
        id: validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate -no-color
        continue-on-error: true

      # Always saved with -out: the apply below consumes this exact file
      # rather than re-planning, so what was published is what runs.
      - name: Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Publish the plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 14
          if-no-files-found: error

      # One comment per pull request, updated in place on every push — the
      # shape from HashiCorp's "Automate Terraform with GitHub Actions"
      # tutorial, minus HCP Terraform (see ADR 0004 for why not).
      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FMT: ${{ steps.fmt.outcome }}
          INIT: ${{ steps.init.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const marker = '<!-- terraform-plan-comment -->'
            const raw = process.env.PLAN || '(no plan output)'
            const plan = raw.length > 60000
              ? raw.slice(0, 60000) + '\n... (truncated — the full output is in the workflow log)'
              : raw
            const body = [
              marker,
              '#### Terraform — against a clean floci emulator',
              '',
              '| Step | Outcome |',
              '| --- | --- |',
              `| \`fmt -check\` | ${process.env.FMT} |`,
              `| \`init\` | ${process.env.INIT} |`,
              `| \`validate\` | ${process.env.VALIDATE} |`,
              `| \`plan\` | ${process.env.PLAN_OUTCOME} |`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '*Merging this pull request applies — plan on pull request, apply on merge (ADR 0004).*',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Fail the job if a step failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "::error::fmt=${{ steps.fmt.outcome }} validate=${{ steps.validate.outcome }} plan=${{ steps.plan.outcome }}"
          exit 1

      # Merge means apply. The plan applied is the one this run produced —
      # the pull request's plan described a different emulator instance,
      # a limitation the ephemeral emulator forces (ADR 0004).
      - name: Apply
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -no-color tfplan

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# terraform ${{ github.event_name == 'push' && 'apply' || 'plan' }}"
            echo
            echo "- Emulator: floci, fresh this run, state discarded with it"
            echo "- Plan artifact: \`tfplan-${{ github.run_id }}\`"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "- Applied the plan produced in this run"
            else
              echo "- Nothing was applied"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
