name: Terraform

# The reference design applied against a fresh floci emulator, driven by HCP
# Terraform. This workflow is the only thing that applies the configuration —
# nothing is run by hand — and each run is dispatched to a self-hosted agent
# started here in the job, because HashiCorp's own workers cannot reach an
# emulator on the runner's localhost and this agent can.
#
# Every directory under infra/terraform/ matching NN-name is its own root with
# its own workspace, and they are applied in directory order: 00 before 10
# before 20. They share one job because they must share one emulator — a second
# job would get a second, empty floci, and a layer would be building on subnets
# that exist only in another layer's state.
#
# State outlives the emulator the resources were created in, so every plan reads
# as a first-time create: "this configuration stands up from nothing" is the
# whole claim. There is no real AWS account anywhere in this, and the provider's
# credentials are the fake ones hardcoded in each root's providers.tf.
#
# Applies come from three places only: a push to main, a pull request from a
# branch named exactly for the workspace it changes (twitter-clone-10 for
# 10-network), and a run by hand from one of those. The policy job decides,
# on every pull request, and fails anything else that touches a layer.
#
# Needs two repository secrets, so a pull request from a fork cannot run it:
#   TF_API_TOKEN      a user or team token — authenticates the CLI
#   TFC_AGENT_TOKEN   an agent pool token — authenticates the agent
on:
  # Every pull request, not only Terraform ones: the policy check has to report
  # on all of them to be usable as a required check, or a pull request that
  # never touches Terraform would wait forever for a check that never comes.
  # The policy job does the path filtering itself, and nothing expensive starts
  # unless it says apply.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  # Run it by hand from the Actions tab. The only way to start a run at all:
  # the workspace executes on an agent, and the only agent that ever exists is
  # the one this job starts, so a run queued from the HCP Terraform UI waits
  # for an agent that never arrives.
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy the resources after applying them, in the same job"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  # Which branch may apply what. A layer is changed only from a branch named
  # exactly for its workspace, one layer per branch — so a workspace can have one
  # branch in flight at a time, the name itself is the lock, and it frees when
  # the branch is deleted on merge. Cheap and service-free, so it can run on
  # every pull request.
  policy:
    name: Terraform policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs on every pull request and only reads the diff.
    permissions:
      contents: read
    outputs:
      apply: ${{ steps.decide.outputs.apply }}
    steps:
      # Depth 2: on a pull request the checkout is the merge commit, whose first
      # parent is the base, so HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          verdict() { echo "apply=$1" >> "$GITHUB_OUTPUT"; echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"; }
          refuse() { echo "::error::$1"; echo "**Refused:** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          workspace_branch='^twitter-clone-([0-9]{2})$'

          case "$EVENT" in
            push)
              verdict true "Push to main: applies."
              exit 0 ;;
            workflow_dispatch)
              if [ "$REF_NAME" = main ] || [[ "$REF_NAME" =~ $workspace_branch ]]; then
                verdict true "Run by hand on $REF_NAME: applies."
                exit 0
              fi
              refuse "a run by hand applies only from main or a twitter-clone-NN branch, not from $REF_NAME" ;;
          esac

          # A plain assignment, not inside the process substitution below: there a
          # failed diff would yield no layers and wave a layer change through. Here
          # set -e stops the job, so the gate fails closed.
          # --no-renames: a file moved from one layer to another touches both, and
          # rename detection would report only where it landed.
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          mapfile -t layers < <(printf '%s\n' "$changed" \
            | sed -nE 's#^infra/terraform/([0-9]{2}-[^/]+)/.*#\1#p' | sort -u)

          if [[ "$HEAD_REF" =~ $workspace_branch ]]; then
            nn="${BASH_REMATCH[1]}"
            shopt -s nullglob
            dirs=(infra/terraform/"$nn"-*/)
            shopt -u nullglob
            [ "${#dirs[@]}" -eq 1 ] \
              || refuse "branch $HEAD_REF names workspace $nn, but there is no single layer infra/terraform/$nn-*/"
            want=$(basename "${dirs[0]}")
            if [ "${#layers[@]}" -ne 1 ] || [ "${layers[0]}" != "$want" ]; then
              refuse "branch $HEAD_REF may change $want and no other layer, and must change it; this pull request changes: ${layers[*]:-no layer}"
            fi
            verdict true "Branch $HEAD_REF changes $want: applies."
            exit 0
          fi

          if [ "${#layers[@]}" -gt 0 ]; then
            refuse "this pull request changes ${layers[*]}, from branch $HEAD_REF. A layer is changed only from a branch named for its workspace — twitter-clone-NN, one layer per branch — never feat/ or any other name."
          fi
          verdict false "Branch $HEAD_REF changes no layer: no apply."

  terraform:
    name: Terraform
    needs: policy
    if: needs.policy.outputs.apply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One apply at a time, across the whole repository: there is one agent, and
    # every run applies every layer into its shared workspace. On this job rather
    # than the workflow, so the policy check on an unrelated pull request never
    # queues behind an apply or bumps a waiting one out. A running apply is never
    # cancelled — that would leave a workspace locked mid-apply. GitHub keeps one
    # waiting run per group, so a newer one replaces an older one still waiting.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    # No Docker socket here: EKS applies in mock mode.
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_EKS_MOCK: "true"
          FLOCI_STORAGE_MODE: memory

    steps:
      - uses: actions/checkout@v4

      # Fail in two seconds with the reason, rather than thirty seconds later
      # inside a container that says only "token is required".
      - name: Check the HCP Terraform secrets are set
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TFC_AGENT_TOKEN: ${{ secrets.TFC_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$TF_API_TOKEN" ] || missing="$missing TF_API_TOKEN"
          [ -n "$TFC_AGENT_TOKEN" ] || missing="$missing TFC_AGENT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — see the README. A pull request from a fork never has them."
            exit 1
          fi

      # Before anything runs init, because init is what does the damage. A layer
      # whose cloud.tf names a workspace that does not exist has it created, on
      # Remote execution, and the run dies on HashiCorp's workers with no emulator
      # to reach. A layer copied from a neighbour that still names the
      # neighbour's workspace fails nothing at all: it writes its state over the
      # other layer's. Both are checked here in seconds, from the API, rather than
      # found minutes into an apply — or never.
      - name: Check every layer's workspace
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          for dir in infra/terraform/[0-9][0-9]-*/; do
            layer=$(basename "$dir")
            want="twitter-clone-${layer:0:2}"
            org=$(sed -nE 's/^[[:space:]]*organization[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$dir/cloud.tf")
            got=$(sed -nE 's/^[[:space:]]*name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$dir/cloud.tf")
            if [ "$got" != "$want" ]; then
              echo "::error file=${dir}cloud.tf::$layer names workspace '${got:-<none>}', but its prefix means '$want'"
              fail=1
              continue
            fi
            # --fail is not used: a 404 is an answer, not a transport error.
            code=$(curl -sS -o "$RUNNER_TEMP/ws.json" -w '%{http_code}' \
              -H "Authorization: Bearer $TF_API_TOKEN" \
              -H "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/$org/workspaces/$want")
            if [ "$code" = 404 ]; then
              echo "::error::$layer: workspace '$want' does not exist in '$org'. Create it on Agent execution before this runs — init would create it on Remote execution, which cannot reach floci."
              fail=1
              continue
            fi
            if [ "$code" != 200 ]; then
              echo "::error::$layer: HCP Terraform answered $code for workspace '$want'"
              fail=1
              continue
            fi
            mode=$(jq -r '.data.attributes["execution-mode"]' "$RUNNER_TEMP/ws.json")
            if [ "$mode" != agent ]; then
              echo "::error::$layer: workspace '$want' is on '$mode' execution, not agent, so its run cannot reach floci"
              fail=1
              continue
            fi
            echo "$layer -> $want (agent execution)"
          done
          exit "$fail"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      # 127.0.0.1 rather than localhost: floci binds 0.0.0.0, which is IPv4
      # only, and a resolver that answers localhost with ::1 first turns a
      # healthy emulator into a connection refused.
      - name: Wait for floci
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            curl -fsS --max-time 5 http://127.0.0.1:4566/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::floci did not answer on :4566"
          exit 1

      # Host networking, so the agent reaches the emulator on the same
      # localhost:4566 that var.endpoint defaults to. The token is passed
      # through the environment rather than on the command line.
      - name: Start the HCP Terraform agent
        env:
          TFC_AGENT_TOKEN: ${{ secrets.TFC_AGENT_TOKEN }}
          TFC_AGENT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker run --detach --name tfc-agent --network host \
            --env TFC_AGENT_TOKEN \
            --env TFC_AGENT_NAME \
            hashicorp/tfc-agent:latest

      - name: Wait for the agent to register
        env:
          TFC_AGENT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker logs tfc-agent 2>&1 | grep -qi 'registered'; then
              # Named in the log so a run in HCP Terraform can be matched to the
              # agent that executed it. A run picked up by any other agent in the
              # pool cannot reach this job's emulator.
              echo "Agent '$TFC_AGENT_NAME' registered with HCP Terraform."
              docker logs tfc-agent 2>&1 | grep -i 'registered' | tail -1
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' tfc-agent)" != "true" ]; then
              echo "::error::the agent exited before registering"
              docker logs tfc-agent
              exit 1
            fi
            sleep 2
          done
          echo "::error::the agent did not register within 120s"
          docker logs tfc-agent
          exit 1

      # The apply reaches floci on 127.0.0.1 only because the agent shares the
      # runner's network namespace. Assert that here, rather than discovering it
      # fifty seconds into an apply as nine retries and a connection refused.
      - name: Check the agent shares the runner's network
        run: |
          set -euo pipefail
          mode=$(docker inspect tfc-agent --format '{{.HostConfig.NetworkMode}}')
          echo "agent network mode: $mode"
          if [ "$mode" != "host" ]; then
            echo "::error::the agent is on network '$mode', not host, so it cannot reach floci on 127.0.0.1"
            exit 1
          fi

      - run: terraform fmt -check -recursive -no-color infra/terraform

      # `shell: bash` throughout, for pipefail: without it `tee` would swallow a
      # failing terraform and the step would pass. Each layer gets its own log
      # file, which is what the summary below reads back.
      - name: Apply every layer, in order
        shell: bash
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/tf-plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/terraform/[0-9][0-9]-*/; do
            layer=$(basename "$dir")
            echo "::group::$layer — init and validate"
            terraform -chdir="$dir" init -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
            echo "::group::$layer — apply"
            terraform -chdir="$dir" apply -auto-approve -no-color \
              | tee "$RUNNER_TEMP/$layer.apply.log"
            echo "::endgroup::"
          done

      # Reverse order, because a layer cannot go before what depends on it. The
      # emulator is created and destroyed with the job, so a destroy only means
      # anything in the same job that applied: on its own it would meet an empty
      # emulator, find nothing to remove and report zero destroyed — true, and no
      # demonstration of anything.
      - name: Destroy every layer, in reverse
        if: inputs.destroy
        shell: bash
        run: |
          mapfile -t dirs < <(printf '%s\n' infra/terraform/[0-9][0-9]-*/ | sort -r)
          for dir in "${dirs[@]}"; do
            layer=$(basename "$dir")
            echo "::group::$layer — destroy"
            terraform -chdir="$dir" destroy -auto-approve -no-color \
              | tee "$RUNNER_TEMP/$layer.destroy.log"
            echo "::endgroup::"
          done

      # Two places to look is one too many. The run's own page gets a row per
      # layer and a link into HCP Terraform, where the plan and apply are
      # readable rather than buried in a shell log.
      - name: Summarise the run
        if: always()
        shell: bash
        run: |
          # GITHUB_STEP_SUMMARY is a different file in every step, so the panel
          # is built in a real file first: this step appends it to its own
          # summary, and the step after reads it back to comment.
          summary="$RUNNER_TEMP/summary.md"
          : > "$summary"
          shopt -s nullglob
          logs=("$RUNNER_TEMP"/*.apply.log "$RUNNER_TEMP"/*.destroy.log)
          shopt -u nullglob
          if [ ${#logs[@]} -gt 0 ]; then
            {
              echo "### Terraform"
              echo
              echo "| Layer | Action | Result | HCP run |"
              echo "| --- | --- | --- | --- |"
              for log in "${logs[@]}"; do
                base=$(basename "$log" .log)
                result=$(grep -aoE '(Apply|Destroy) complete! Resources:.*' "$log" | tail -1 || true)
                # A layer with nothing to do prints "No changes." and never the
                # "complete!" line. That is a success, not a silence, and
                # reporting it as "did not complete" on a green run sends you
                # looking for a failure.
                if [ -z "$result" ] && grep -qaE 'No changes\.|Planned and finished' "$log"; then
                  result="No changes"
                fi
                url=$(grep -aoE 'https://app\.terraform\.io/app/[^ ]+/runs/run-[A-Za-z0-9]+' "$log" | tail -1 || true)
                if [ -n "$url" ]; then
                  link="[${url##*/}]($url)"
                else
                  link="—"
                fi
                echo "| \`${base%.*}\` | ${base##*.} | ${result:-did not complete} | $link |"
              done
            } >> "$summary"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      # The same panel, on the pull request, edited in place rather than added
      # to on every push. --create-if-none is recent; the fallback covers a
      # runner whose gh predates it.
      - name: Put the summary on the pull request
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          summary="$RUNNER_TEMP/summary.md"
          [ -s "$summary" ] || { echo "::warning::no summary was produced"; exit 0; }
          gh pr comment "$PR" --body-file "$summary" --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file "$summary"

      # SIGTERM, so the agent deregisters instead of leaving a dead entry
      # occupying the one agent the free tier allows.
      - name: Stop the agent
        if: always()
        run: |
          set -euo pipefail
          if [ -n "$(docker ps -aq --filter 'name=^tfc-agent$')" ]; then
            docker stop --timeout 30 tfc-agent >/dev/null
            docker rm tfc-agent >/dev/null
          fi
