name: Terraform

# The reference design applied against a fresh floci emulator. State is local
# and thrown away with the runner, so the apply is free and side-effect-free —
# a green check means this configuration stands up from nothing. There is no
# real AWS account anywhere in this.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: infra/terraform

    # No Docker socket here: EKS applies in mock mode.
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_EKS_MOCK: "true"
          FLOCI_STORAGE_MODE: memory

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Wait for floci
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            curl -fsS --max-time 5 http://localhost:4566/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::floci did not answer on :4566"
          exit 1

      - run: terraform fmt -check -recursive -no-color
      - run: terraform init -no-color
      - run: terraform validate -no-color
      - run: terraform apply -auto-approve -no-color
