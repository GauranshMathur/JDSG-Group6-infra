name: Security

# Separate from ci.yml so that it is obviously never conditional. Whatever a
# pull request changes, the tree gets scanned for committed secrets — a
# credential pasted into a markdown file is every bit as leaked as one in a
# Terraform variable.
#
# It is also what makes the `Trivy` code-scanning check appear on every pull
# request. That check is created by the SARIF upload rather than being a job, so
# if the only upload lived in a conditional job, pull requests that skipped it
# would show the check as expected and waiting for a status that never arrives.
on:
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Findings in code we control, so any fixable HIGH or CRITICAL fails.
      #
      # ignore-unfixed keeps this achievable: only findings with a fix available
      # count. One with no upstream patch cannot be actioned by any change here,
      # so failing on it would teach everyone to ignore the gate.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The gating scan above only sets an exit code — its findings went
      # nowhere. This second pass reports every severity into the Security tab:
      # one scan decides pass or fail, the other is the record.
      #
      # always(), so a failing gate still publishes what it found. A scan that
      # fails the build without saying why is the less useful half of the two.
      - name: Trivy filesystem scan (report all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
