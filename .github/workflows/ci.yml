name: CI

# One workflow, one job, one check on the pull request. Steps run cheapest
# first. Terraform checks are NOT here — they live in terraform.yml, path-
# scoped, because they start an emulator (ADR 0004).
on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Catches what a YAML parser cannot — expression injection, invalid
      # `needs:` references — and shellchecks every `run:` block.
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

      # `config` resolves interpolation and merges and rejects unknown keys
      # without starting anything.
      - name: Validate the Compose files
        run: |
          set -euo pipefail
          for file in infra/docker/*.yml infra/docker/*.yaml; do
            [ -e "$file" ] || continue
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

      # The one security gate: secrets, vulnerable dependencies and
      # misconfiguration over the whole tree, failing on any fixable HIGH
      # or CRITICAL. ignore-unfixed keeps that achievable — a finding with
      # no upstream patch cannot be actioned by any change here. This scan
      # is also what makes throwaway spike Terraform unmergeable, which is
      # deliberate (see docs/ci-cd.md).
      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
