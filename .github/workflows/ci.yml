name: CI

# One pipeline, because this repository holds one kind of thing. The app
# repository's parent/child routing existed to decide between app and infra
# work living side by side; splitting the repositories removed the decision.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Catches what a YAML parser cannot: expression injection, invalid `needs:`
  # references, deprecated syntax. It also runs shellcheck over every `run:`
  # block, so the bash in these workflows is linted rather than read by eye.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # `config` resolves and validates the file — interpolation, merges,
      # unknown keys — without starting anything.
      - name: Validate the Compose files
        run: |
          set -euo pipefail
          found=0
          for file in infra/docker/*.yml infra/docker/*.yaml; do
            [ -e "$file" ] || continue
            found=1
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No Compose files found under infra/docker — this job expects at least one."
            exit 1
          fi

          echo "All Compose files are valid."

  # Terraform, Kubernetes manifests and Dockerfiles are all things Trivy's
  # misconfiguration scanner understands. It finds nothing much today because
  # `infra/` holds two Compose files; it is here so that the first Terraform
  # commit is scanned by a gate that already exists rather than one added
  # afterwards.
  misconfig:
    name: Misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"

  # The Terraform pipeline lands with the Terraform itself in I-1b, rather than
  # being scaffolded here first against nothing:
  #
  #   terraform fmt -check -recursive
  #   terraform init          (S3 backend on floci, bucket bootstrapped first)
  #   terraform validate
  #   terraform plan -out=tfplan        -> uploaded as a build artifact
  #   terraform apply tfplan            -> applies what was planned, not a re-plan
  #
  # floci runs as a service container in the job, so the emulator is fresh every
  # run. That is the point: the gate proves the configuration stands up from
  # nothing. See docs/roadmap.md.
